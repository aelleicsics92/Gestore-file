name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build debug APK (telefono + orologio)
        run: gradle :app:assembleDebug :wear:assembleDebug --no-daemon --stacktrace
      - name: Rename APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk GestoreFile.apk
          cp wear/build/outputs/apk/debug/wear-debug.apk GestoreFileWatch.apk
      - uses: actions/upload-artifact@v4
        with:
          name: GestoreFile-apk
          path: |
            GestoreFile.apk
            GestoreFileWatch.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Build ${{ github.run_number }}
          files: |
            GestoreFile.apk
            GestoreFileWatch.apk
