name: inspect
on:
  push:
    branches: [inspect]
jobs:
  x:
    runs-on: ubuntu-latest
    steps:
      - name: Versions
        run: |
          B=https://repo1.maven.org/maven2/com/flyfishxu/kadb-android
          for v in $(curl -s $B/maven-metadata.xml | grep -o '<version>[^<]*' | sed 's/<version>//'); do
            echo "v=$v kotlin=$(curl -s $B/$v/kadb-android-$v.pom | grep -A1 'kotlin-stdlib' | grep -o '<version>[^<]*' | head -1)"
          done
